# Optional remote image builder: start a pipeline manually in the GitLab UI.
# NRP's shared runners use the maintained osscontainertools Kaniko fork.
stages:
  - build

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

build-runner:
  stage: build
  image:
    name: ghcr.io/osscontainertools/kaniko:debug
    entrypoint: [""]
  when: manual
  allow_failure: false
  timeout: 3h
  variables:
    GODEBUG: http2client=0
    KUBERNETES_CPU_REQUEST: "2"
    KUBERNETES_CPU_LIMIT: "4"
    KUBERNETES_MEMORY_REQUEST: 4Gi
    KUBERNETES_MEMORY_LIMIT: 8Gi
    KUBERNETES_EPHEMERAL_STORAGE_REQUEST: 30Gi
    KUBERNETES_EPHEMERAL_STORAGE_LIMIT: 40Gi
  script:
    - |
      set -eu
      test "$(uname -m)" = x86_64
      umask 077
      mkdir -p /kaniko/.docker
      registry_auth="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$registry_auth" > /kaniko/.docker/config.json
      unset registry_auth
      trap 'rm -f /kaniko/.docker/config.json' EXIT
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/docker/inference.Dockerfile" \
        --custom-platform linux/amd64 \
        --destination "$CI_REGISTRY_IMAGE/math-eval:$CI_COMMIT_SHA" \
        --cache=true \
        --cache-repo "$CI_REGISTRY_IMAGE/build-cache" \
        --compressed-caching=false \
        --push-retry=3 \
        --digest-file "$CI_PROJECT_DIR/runner-digest.txt" \
        --image-name-with-digest-file "$CI_PROJECT_DIR/runner-image.txt"
      printf 'Published runner: '
      cat "$CI_PROJECT_DIR/runner-image.txt"
      printf '\n'
  artifacts:
    paths:
      - runner-image.txt
      - runner-digest.txt
    expire_in: 1 year

# Verify the published image directly on NRP; see docs/nrp-verification.md.
