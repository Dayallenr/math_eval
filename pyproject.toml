[project]
name = "math-eval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.31,<2",
    "pyarrow>=20",
    "harbor==0.23.0",
]

[project.optional-dependencies]
inference = [
    "torch>=2.6,<2.10",
    "transformers>=5,<6",
    "accelerate>=1.10,<2",
]
grading = [
    "math-verify[antlr4_13_2]==0.9.0",
    "latex2sympy2-extended==1.11.0",
    "sympy==1.14.0",
]

[project.scripts]
math-eval = "math_eval.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
