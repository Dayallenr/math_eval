# Published lab images: copy to nrp.toml (ignored by Git).
# These digests completed the 823-question baseline evaluation; see docs/nrp-verification.md.
# The remote tmux coordinator uses your login. Legacy service-account fields remain
# for compatibility with pinned images/saved requests; no setup/RBAC command is required.
context = "nautilus"
namespace = "wang-research-lab"
image = "gitlab-registry.nrp-nautilus.io/dayallen/model-eval/math-eval@sha256:386537c9ee80c892ce19984508b48f443c57481ef650b91c5428a1d5e9ca7b42"
image_pull_secret = "nrp-registry-dayallen" # Empty string for a publicly pullable image.
service_account = "math-eval-controller"
harbor_service_account = "math-eval-harbor"
task_image = "gitlab-registry.nrp-nautilus.io/dayallen/model-eval/math-task@sha256:0893dbcc6500a1f19957e43e5a9cf1528c9b62470ffd091702d504312c1f9c1d"
sandbox_timeout = 1800
# Optional: enables --model exports/model-v1 instead of PVC:exports/model-v1.
model_pvc = ""
suite_pvc = "shared-pvc"
output_pvc = "shared-pvc" # Must support ReadWriteMany.
output_relative_path = "math-eval/evaluations"
# Pinned archive already on shared-pvc; no repeated dataset upload for a new model.
suite_archive = "math-eval/archives/math-seven-b43163a56bb3-pilot-b7a747d5908a.tgz"
archive_sha256 = "208e3344aaba2a3e1be1fb6edd50eb8a28dd09a32f9213918148b277ecfd5643"
full_suite = "math-seven"
full_sha256 = "b43163a56bb3944876ec01c781feedb8dcd4fcea74ca1d44491f17cd8c1ad121"
pilot_suite = "pilot-seven"
pilot_sha256 = "b7a747d5908a0c2436c06c388fde4479816cb80bded0e292a0617123bccd88ce"
# Generic resource + VRAM constraint allows L40 and other eligible generic GPUs.
# NRP advertises A6000 separately: use "nvidia.com/rtxa6000" for that pool.
# A100 uses "nvidia.com/a100" and needs lab quota; the memory constraint still applies.
gpu_resource = "nvidia.com/gpu"
min_gpu_memory_mib = 40960 # Strictly greater than 40 GiB; excludes 40 GB-class cards.
generation_timeout = 172800 # Seconds, including scheduling time: adjust for model speed.
grading_timeout = 21600
poll_seconds = 10
grading_concurrency = 2

[settings]
batch_size = 1
max_new_tokens = 12288 # Generated tokens: reasoning plus final answer; excludes prompt.
max_input_tokens = 8192
# Qwen3-8B non-thinking profile; preserves the original SFT evaluation mode.
# Thinking profile: enable_thinking=true, temperature=0.6, top_p=0.95; keep top_k/min_p.
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
seed = 42
enable_thinking = false
device = "cuda"
dtype = "auto"

# Additional single-container tasks: map each exact Dockerfile SHA256 to its published image.
[task_images]
