# Copy to nrp.toml (ignored by Git). Fill in the published image.
context = "nautilus"
namespace = "wang-research-lab"
image = "YOUR-REGISTRY/YOUR-PROJECT/math-eval:nrp-v2"
image_pull_secret = "nrp-registry" # Empty string for a publicly pullable image.
service_account = "math-eval-controller"
harbor_service_account = "math-eval-harbor"
task_image = "YOUR-REGISTRY/YOUR-PROJECT/math-task:nrp-v2"
sandbox_timeout = 1800
# Optional: enables --model exports/model-v1 instead of PVC:exports/model-v1.
model_pvc = ""
suite_pvc = "shared-pvc"
output_pvc = "shared-pvc" # Must support ReadWriteMany.
output_relative_path = "math-eval/evaluations"
# Pinned archive already uploaded to shared-pvc; no dataset downloads per laptop.
suite_archive = "math-eval/archives/math-five-51ba33d52138-pilot-65433b136342.tgz"
archive_sha256 = "899553e4869174b347dcd9924fef41528c3334be14c2750c524263400e1347ba"
full_suite = "math-five"
full_sha256 = "51ba33d52138a6593897ef0fe1169af4e7d5b34a90099389fe4b5efcdba7b217"
pilot_suite = "pilot"
pilot_sha256 = "65433b13634216d12811ba5776ed59d589a51e2207718822013400debf2c1207"
# Generic resource + VRAM constraint allows L40 and other eligible generic GPUs.
# NRP advertises A6000 separately: use "nvidia.com/rtxa6000" for that pool.
# A100 uses "nvidia.com/a100" and needs lab quota; the memory constraint still applies.
gpu_resource = "nvidia.com/gpu"
min_gpu_memory_mib = 40960 # Strictly greater than 40 GiB; excludes 40 GB-class cards.
generation_timeout = 172800 # Seconds, including scheduling time: adjust for model speed.
grading_timeout = 21600
poll_seconds = 10
grading_concurrency = 2

[settings]
batch_size = 1
max_new_tokens = 8192
max_input_tokens = 8192
temperature = 0.0
top_p = 1.0
seed = 42
enable_thinking = false
device = "cuda"
dtype = "auto"

# Additional single-container tasks: map each exact Dockerfile SHA256 to its published image.
[task_images]
